name: QualityGate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualitygate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.9.2
      - run: pnpm check
      - run: pnpm verify:ci-templates
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm verify:analysis-package
      - run: pnpm smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          QUALITYGATE_CHROME_NO_SANDBOX: '1'
      - run: pnpm verify:package
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          QUALITYGATE_CHROME_NO_SANDBOX: '1'
      - run: pnpm smoke:dashboard
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          QUALITYGATE_CHROME_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualitygate-evidence
          path: |
            .qualitygate/
            coverage/
          include-hidden-files: true
