name: QualityGate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
env:
  HUSKY: '0'
concurrency:
  group: qualitygate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Run gates and render report
        shell: bash
        run: |
          mkdir -p .qualitygate-ci
          set +e
          pnpm exec qualitygate run --json > .qualitygate-ci/result.json
          status=$?
          set -e
          printf '%s\n' "$status" > .qualitygate-ci/exit-code
          pnpm exec qualitygate report --input .qualitygate-ci/result.json --output .qualitygate-ci/report.md
          exit "$status"
      - if: always()
        shell: bash
        run: |
          if [ -f .qualitygate-ci/report.md ]; then cat .qualitygate-ci/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualitygate-report
          include-hidden-files: true
          path: |
            .qualitygate-ci/
            .qualitygate/
  publish:
    needs: check
    if: ${{ always() && needs.check.result != 'cancelled' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Publication runs trusted base code, never code from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: qualitygate-report
          path: incoming
      # Pick one report surface with the repository variable QUALITYGATE_PR_MODE (default: description).
      - name: Update the managed description block
        if: ${{ vars.QUALITYGATE_PR_MODE != 'comment' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm exec qualitygate pr --provider github --repository "$PR_REPOSITORY" --head-repository "$PR_HEAD_REPOSITORY"
          --number "$PR_NUMBER" --head "$PR_HEAD" --input incoming/.qualitygate-ci/result.json --write --json
      - name: Update the sticky comment
        if: ${{ vars.QUALITYGATE_PR_MODE == 'comment' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm exec qualitygate comment --repository "$PR_REPOSITORY" --head-repository "$PR_HEAD_REPOSITORY"
          --number "$PR_NUMBER" --head "$PR_HEAD" --report-url "$REPORT_URL"
          --input incoming/.qualitygate-ci/result.json --write --json
      - name: Set the commit status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm exec qualitygate status --repository "$PR_REPOSITORY" --head-repository "$PR_HEAD_REPOSITORY"
          --head "$PR_HEAD" --report-url "$REPORT_URL" --input incoming/.qualitygate-ci/result.json --write --json
      # Optional: needs the repository secret SLACK_WEBHOOK_URL. Sends only on BLOCK or error.
      - name: Notify Slack
        if: ${{ vars.QUALITYGATE_SLACK == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm exec qualitygate notify --input incoming/.qualitygate-ci/result.json
          --report-url "$REPORT_URL" --write --json
